name: Godot regression tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Prime Godot import cache
        run: ./godot --headless --editor --quit --path .
      - name: Parse project
        run: |
          set -o pipefail
          ./godot --headless --editor --quit --path . 2>&1 | tee parse.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" parse.log
      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          for scene in \
            tests/test_corpse_coordination.tscn \
            tests/test_enemy_search.tscn \
            tests/test_enemy_archetypes.tscn \
            tests/test_encounter_intelligence.tscn \
            tests/test_game_settings.tscn \
            tests/test_noise_roles.tscn \
            tests/test_melee_balance.tscn \
            tests/test_cleanup_registry.tscn \
            tests/test_cleanup_scoring.tscn \
            tests/test_cleanup_tools.tscn \
            tests/test_campaign_ui.tscn \
            tests/test_campaign_map_identity.tscn \
            tests/test_destructible_environment.tscn \
            tests/test_destruction_pipeline.tscn \
            tests/test_prop_restoration.tscn \
            tests/test_death_ragdoll_pipeline.tscn \
            tests/test_corpse_wall_safety.tscn \
            tests/test_projectile_collision.tscn \
            tests/test_door_passage.tscn \
            tests/test_visual_readability.tscn \
            tests/test_mission_objectives.tscn \
            tests/test_mission_result_flow.tscn \
            tests/test_progression_store.tscn \
            tests/test_runtime_budget.tscn \
            tests/test_runtime_cadence.tscn \
            tests/test_performance_stress.tscn \
            tests/test_release_metadata.tscn \
            tests/test_security_camera.tscn \
            tests/test_weapon_inventory.tscn \
            tests/test_weapon_throw.tscn \
            tests/test_blood_footprints.tscn \
            tests/test_blood_forensics.tscn \
            tests/test_pixel_blood_canvas.tscn \
            tests/test_pixel_liquid_system.tscn \
            tests/test_pixel_environment.tscn \
            tests/test_character_animation.tscn \
            tests/test_character_eight_way_visual.tscn \
            tests/test_combat_audio_director.tscn \
            tests/test_tactical_alert.tscn \
            tests/test_tactical_lab_scale.tscn \
            tests/test_vertical_slice.tscn \
            tests/test_ai_black_box.tscn; do
            log_file="$(basename "$scene" .tscn).log"
            ./godot --headless --path . "$scene" 2>&1 | tee "$log_file"
            ! grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" "$log_file"
          done
